<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Playwright Test Summary</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
      h1 { color: #0f172a; }
      .summary { margin-bottom: 16px; font-size: 16px; }
      .stats { margin-bottom: 20px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #cbd5e1; padding: 12px; vertical-align: top; }
      th { background: #f8fafc; }
      img { border: 1px solid #e2e8f0; max-width: 320px; max-height: 240px; }
      .passed { color: green; font-weight: bold; }
      .failed { color: red; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>Playwright Test Summary</h1>
    <div class="summary">Generated from the latest Playwright run.</div>
    <div class="stats">
      <div><span class="passed">Passed:</span> 2</div>
      <div><span class="failed">Failed:</span> 0</div>
      <div>Total: 2</div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Test Case</th>
          <th>Status</th>
          <th>Screenshot</th>
        </tr>
      </thead>
      <tbody>
      <tr>
        <td>Reqres API assignment</td>
        <td><span class="passed">Passed</span></td>
        <td>No screenshot</td>
      </tr>
      <tr>
        <td>DemoQA UI assignment</td>
        <td><span class="passed">Passed</span></td>
        <td>No screenshot</td>
      </tr></tbody>
    </table>
  </body>
</html>
